[project]
name = "applied-ai-system-project"
version = "0.1.0"
description = "VibeScorecard: an explainable, guarded music recommender with an optional Claude natural-language front end"
readme = "README.md"
authors = [
    { name = "Monica Martin", email = "31086980+monicam85@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = ["anthropic==2.5.0"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
applied-ai-system-project = "applied_ai_system_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
